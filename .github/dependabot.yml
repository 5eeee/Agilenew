version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        patterns:
          - next
          - react
          - react-dom
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

